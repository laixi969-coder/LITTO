# LITTO 正式域名入口 —— 阶段二（最终形态）
#   http://milimili.net.cn  →  301  →  https://milimili.net.cn
#   https://milimili.net.cn →  反代 →  127.0.0.1:13000
# 证书由 certbot（Let's Encrypt, HTTP-01/webroot）签发，systemd timer 自动续期。

server {
    listen 80;
    listen [::]:80;
    server_name milimili.net.cn www.milimili.net.cn;

    # 续期校验必须保留，且不能被跳转吞掉
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name milimili.net.cn www.milimili.net.cn;

    ssl_certificate     /etc/letsencrypt/live/milimili.net.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/milimili.net.cn/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/milimili.net.cn/chain.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    # 备案/安全扫描常要求的安全响应头
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;

    client_max_body_size 512m;
    client_body_timeout  300s;

    proxy_read_timeout    3600s;
    proxy_send_timeout    3600s;
    proxy_connect_timeout 30s;

    location / {
        proxy_pass http://127.0.0.1:13000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }
}
