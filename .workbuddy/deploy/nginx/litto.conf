# LITTO 反代 —— 阶段一：备案未完成时走非标端口 18443 + 自签证书（兜底入口，保留）。
# 正式域名入口见 milimili.conf（:80 / :443）。
# map 定义已移到 00-litto-upgrade-map.conf，避免重复定义。

server {
    # Ubuntu 24.04 自带 nginx 1.24，不支持独立的 `http2 on;`（1.25.1+ 才有），
    # 用 listen 参数形式，新旧版本都可用（新版本仅告警）。
    listen 18443 ssl http2;
    server_name milimili.net.cn 162.14.110.219 _;

    ssl_certificate     /etc/nginx/ssl/litto.crt;
    ssl_certificate_key /etc/nginx/ssl/litto.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 应用允许 100MB 级 JSON 与媒体上传，留足余量
    client_max_body_size 512m;
    client_body_timeout  300s;

    # 生成/转码任务耗时较长，超时放宽
    proxy_read_timeout   3600s;
    proxy_send_timeout   3600s;
    proxy_connect_timeout 30s;

    location / {
        proxy_pass http://127.0.0.1:13000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 应用靠这个头判断 HTTPS（LITTO_TRUST_PROXY=1 时生效），会话 Cookie 带 Secure 必需
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Agent 流式输出 / SSE 不能被缓冲
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }
}
