# LITTO 正式域名入口 —— 阶段一（仅用于申请证书）
# certbot 通过 HTTP-01 校验需要 80 端口可达，此时 443 还没证书，故先只开 80。
# 证书签发成功后本文件会被 milimili.conf 覆盖。

server {
    listen 80;
    listen [::]:80;
    server_name milimili.net.cn www.milimili.net.cn;

    # certbot --webroot 校验目录
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        default_type "text/html; charset=utf-8";
        return 200 '<!doctype html><meta charset="utf-8"><title>LITTO</title><h2>站点正在启用 HTTPS，请稍候。</h2>';
    }
}
